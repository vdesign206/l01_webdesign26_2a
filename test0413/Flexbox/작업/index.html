<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Flexbox 연습</title>
    <style>
      ul {
        display: flex;
      }

      .container {
        display: flex;
        justify-content: center;
        flex-wrap: nowrap;
      }
      .item {
        width: 100px;
        height: 30px;
        background-color: skyblue;
        border: 1px solid blue;
        border-radius: 15px;
        text-align: center;
        line-height: 30px;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>box1</li>
      <li>box2</li>
      <li>box3</li>
      <li>box4</li>
      <li>box5</li>
    </ul>
    <div class="container">
      <div class="item">box1</div>
      <div class="item">box2</div>
      <div class="item">box3</div>
      <div class="item">box4</div>
      <div class="item">box5</div>
      <div class="item">box5</div>
      <div class="item">box5</div>
      <div class="item">box5</div>
      <div class="item">box5</div>
      <div class="item">box5</div>
      <div class="item">box5</div>
    </div>
  </body>
</html>
